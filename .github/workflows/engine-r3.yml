name: blood64-engine-r3

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  engine-mips-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned real JFBuild/JFBlood sources
        run: |
          ./scripts/fetch-engine.sh
          ./scripts/stage-engine.sh
          cat engine/UPSTREAM.txt

      - name: Install libdragon CLI
        run: sudo npm install -g libdragon@latest

      - name: Initialize libdragon
        run: |
          mkdir -p "$RUNNER_TEMP/ld"
          cd "$RUNNER_TEMP/ld"
          libdragon init

      - name: N64 compile real engine/game sources
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          cp -a "$GITHUB_WORKSPACE"/. "$RUNNER_TEMP/ld/blood64/"
          cd "$RUNNER_TEMP/ld/blood64"
          libdragon make -f Makefile.engine -j2 2>&1 | tee "$GITHUB_WORKSPACE/engine-r3-build.log"

      - name: Summarize remaining port errors
        if: always()
        run: |
          python3 scripts/summarize-engine-errors.py engine-r3-build.log > engine-r3-summary.txt || true
          cat engine-r3-summary.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blood64-engine-r3-build-report
          if-no-files-found: warn
          path: |
            engine-r3-build.log
            engine-r3-summary.txt

      - name: Fail if compiler failed
        if: steps.compile.outcome != 'success'
        run: exit 1
