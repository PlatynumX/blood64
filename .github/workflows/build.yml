name: build-blood64-r1

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host parser tests
        run: ./scripts/host-test.sh

  n64-rom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip nodejs npm

      - name: Fetch Blood shareware test data
        run: |
          ./shareware-bootstrap/scripts/fetch-shareware.sh
          ./scripts/stage-shareware.sh

      - name: Install libdragon CLI
        run: sudo npm install -g libdragon@latest

      - name: Initialize libdragon toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/ld-project"
          cd "$RUNNER_TEMP/ld-project"
          libdragon init

      - name: Build Blood64 ROM
        run: |
          # libdragon CLI uses its managed Docker/toolchain and mounts the cwd.
          # Copy only our project into the initialized workspace root.
          cp -a "$GITHUB_WORKSPACE"/. "$RUNNER_TEMP/ld-project"/blood64/
          cd "$RUNNER_TEMP/ld-project/blood64"
          libdragon make -j2

      - name: Collect diagnostics
        run: |
          cd "$RUNNER_TEMP/ld-project/blood64"
          sha256sum blood64-r1.z64 > blood64-r1.z64.sha256
          find filesystem/blood -maxdepth 1 -type f -printf '%f %s bytes\n' | sort > blood64-r1-romfs.txt

      - uses: actions/upload-artifact@v4
        with:
          name: blood64-r1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/ld-project/blood64/blood64-r1.z64
            ${{ runner.temp }}/ld-project/blood64/blood64-r1.z64.sha256
            ${{ runner.temp }}/ld-project/blood64/blood64-r1-romfs.txt
